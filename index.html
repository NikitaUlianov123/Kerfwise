<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kerfwise</title>
  <meta name="description" content="Fit rectangular parts on the fewest plywood sheets. Handles blade width, grain direction and edge trim.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='8' width='28' height='16' rx='1' fill='%23c8a165'/%3E%3Cpath d='M12 8v16M2 16h10' stroke='%235a3d14' stroke-width='1.5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <h1>Kerfwise</h1>
    <div class="topbar-actions">
      <button type="button" id="share-btn" class="ghost">Copy share link</button>
      <button type="button" id="print-btn" class="ghost">Print</button>
    </div>
  </header>

  <main class="layout">
    <section class="panel inputs" aria-label="Inputs">
      <h2>Stock sheet</h2>
      <div class="grid-fields">
        <label>Units
          <select id="unit">
            <option value="in">Inches</option>
            <option value="mm">Millimeters</option>
          </select>
        </label>
        <label>Effort
          <select id="effort">
            <option value="quick">Quick</option>
            <option value="normal" selected>Normal</option>
            <option value="thorough">Thorough</option>
          </select>
        </label>
        <label>Length (along grain)
          <input id="sheet-length" inputmode="decimal" autocomplete="off">
        </label>
        <label>Width
          <input id="sheet-width" inputmode="decimal" autocomplete="off">
        </label>
        <label>Blade width (kerf)
          <input id="kerf" inputmode="decimal" autocomplete="off">
        </label>
        <label>Edge trim (each side)
          <input id="trim" inputmode="decimal" autocomplete="off">
        </label>
      </div>
      <label class="check">
        <input type="checkbox" id="sheet-grain">
        Sheet has grain (parts with "Grain" set keep their length along the sheet length)
      </label>
      <p class="hint" id="unit-hint"></p>

      <div class="parts-head">
        <h2>Parts</h2>
        <div class="parts-actions">
          <button type="button" id="paste-btn" class="ghost">Paste list</button>
          <button type="button" id="clear-btn" class="ghost">Clear</button>
        </div>
      </div>
      <div class="table-wrap">
        <table class="parts" id="parts">
          <thead>
            <tr>
              <th>Label</th>
              <th>Length</th>
              <th>Width</th>
              <th>Qty</th>
              <th title="Keep the part length along the sheet grain">Grain</th>
              <th><span class="sr-only">Remove</span></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <button type="button" id="add-btn">Add part</button>
      <ul class="input-errors" id="input-errors" aria-live="polite"></ul>
    </section>

    <section class="results" aria-label="Results">
      <div class="status" id="status" aria-live="polite"></div>
      <div class="summary" id="summary"></div>
      <div id="warnings"></div>
      <div id="sheets"></div>
    </section>
  </main>

  <dialog id="paste-dialog">
    <form method="dialog" class="paste-form">
      <h2>Paste a parts list</h2>
      <p class="hint">One part on each line: <code>length, width, qty, label, grain</code>. Qty, label and grain are optional. Commas, tabs or semicolons separate the fields. <code>24 x 12</code> also works. Grain is <code>y</code> or <code>n</code>.</p>
      <textarea id="paste-text" rows="10" spellcheck="false" placeholder="72, 11 1/4, 2, Side, y&#10;34 1/2, 11 1/4, 5, Shelf&#10;30 x 15"></textarea>
      <label class="check"><input type="checkbox" id="paste-replace"> Replace the current list</label>
      <p class="paste-error" id="paste-error"></p>
      <div class="dialog-actions">
        <button type="submit" value="cancel" class="ghost">Cancel</button>
        <button type="button" id="paste-ok">Add parts</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
